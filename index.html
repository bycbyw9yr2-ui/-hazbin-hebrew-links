<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hazbin Hotel בדיבוב לעברית</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Arial,sans-serif;background:radial-gradient(ellipse at top,#48131d,#101010 75%);color:white}
main{width:min(100%,440px);text-align:center;padding:32px 24px;border:1px solid #652b34;border-radius:24px;background:#171416;box-shadow:0 18px 60px #0008}
.logo{width:76px;height:76px;margin:auto auto 18px;display:grid;place-items:center;border-radius:50%;border:1px solid #e45b69;color:#ffd7dc;background:#42141c;font-size:27px;font-weight:bold}
h1{font-size:30px;margin:0}
p{color:#d6c6c8;line-height:1.7}
#links{display:grid;gap:12px;margin-top:24px}
a{display:block;padding:17px;border-radius:14px;background:#f2eeee;color:#211719;text-decoration:none;font-weight:bold}
footer{font-size:12px;color:#a99b9d;margin-top:24px}
</style>
</head>
<body>
<main>
<div class="logo">HH</div>
<h1>Hazbin Hotel</h1>
<p>בדיבוב לעברית<br>כל העדכונים והסרטונים במקום אחד</p>
<div id="links"></div>
<footer>עמוד מעריצים עצמאי, שאינו קשור רשמית ליוצרי הסדרה.</footer>
</main>
<script>
const profiles={
tiktok:{label:"TikTok"https:https:״//www.tiktok.com/@hazbin.hotel486"},
instagram:{label:"Instagram",url:"https://www.instagram.com/YOUR_INSTAGRAM/"},
youtube:{label:"YouTube",url:"https://www.youtube.com/@YOUR_YOUTUBE"}
};
const params=new URLSearchParams(location.search);
const source=(params.get("from")||"").toLowerCase();
const links=document.getElementById("links");
Object.entries(profiles).forEach(([key,p])=>{
if(key===source)return;
const a=document.createElement("a");
a.href=p.url;
a.target="_blank";
a.rel="noopener noreferrer";
a.textContent="מעבר ל־"+p.label;
links.appendChild(a);
});
</script>
</body>
</html>
