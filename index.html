
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazbin Hotel בעברית</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      background: #17040b;
      text-align: center;
    }

    .poster {
      width: 100%;
      max-height: 72vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    .links {
      padding: 22px 16px 35px;
      background: linear-gradient(#260711, #10030a);
    }

    h1 {
      color: #ffb4cb;
      font-size: clamp(25px, 6vw, 38px);
      margin: 0 0 10px;
    }

    p {
      color: #f5dce5;
      font-size: 17px;
      line-height: 1.6;
      margin: 0 auto 20px;
    }

    .button {
      display: block;
      width: min(100%, 320px);
      margin: 12px auto;
      padding: 15px;
      border: 1px solid #ff8caf;
      border-radius: 12px;
      background: #8f153c;
      color: white;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
    }

    .button:hover {
      background: #bd2458;
    }

    footer {
      color: #cdaab7;
      padding: 15px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <img class="poster" src="./design.png"
       alt="Hazbin Hotel בעברית">

  <main class="links">
    <h1>Hazbin Hotel בעברית</h1>
    <p>
      ברוכים הבאים לפרויקט הדיבוב שלנו!
      <br>
      עקבו אחרינו כדי להתעדכן בסרטונים ובחדשות.
    </p>

    <a class="button"
       href="https://www.tiktok.com/@hazbin.hotel486"
       target="_blank" rel="noopener noreferrer">
      TikTok 🎵
    </a>

    <a class="button"
       href="https://www.instagram.com/hazbinhotelmdwbb/"
       target="_blank" rel="noopener noreferrer">
      Instagram 📸
    </a>

    <a class="button"
       href="https://www.youtube.com/@JonatanHayou-w5e5k"
       target="_blank" rel="noopener noreferrer">
      YouTube ▶️
    </a>

    <footer>פרויקט מעריצים עצמאי — לא רשמי</footer>
  </main>

<img class="poster" src="./design.png"
     alt="Hazbin Hotel בעברית">

</body>
</html>
