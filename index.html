
<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hazbin Hotel בעברית</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #17090f;
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 420px;
      text-align: center;
    }

    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 22px;
      display: flex;
      justify-content: center;
      align-items: center;
      border: 2px solid #d94b69;
      border-radius: 50%;
      background: #350d1c;
      color: #ffb4c6;
      font-family: Georgia, serif;
      font-size: 36px;
      font-weight: bold;
      box-shadow: 0 0 28px #8d183c55;
    }

    h1 {
      margin: 0 0 10px;
      font-family: Georgia, serif;
      font-size: 34px;
      color: #ffb4c6;
    }

    .subtitle {
      margin: 0 0 28px;
      color: #dfc5cd;
      font-size: 16px;
      line-height: 1.7;
    }

    .link {
      display: block;
      margin: 14px 0;
      padding: 16px;
      border: 1px solid #793044;
      border-radius: 10px;
      background: #2b111b;
      color: #fff;
      text-decoration: none;
      font-size: 17px;
      font-weight: bold;
      transition: background 0.2s;
    }

    .link:hover {
      background: #52182c;
    }

    .tiktok {
      border-color: #b82f58;
    }

    .instagram {
      border-color: #a64c77;
    }

    .youtube {
      border-color: #a52c38;
    }

    footer {
      margin-top: 28px;
      color: #a98a95;
      font-size: 12px;
    }
  </style>
</head>

<body>
  <main class="container">
    <div class="logo">HH</div>

    <h1>Hazbin Hotel</h1>

    <p class="subtitle">
      הדיבוב שלנו בעברית
      <br>
      עקבו אחרינו והישארו מעודכנים!
    </p>

    <a class="link tiktok"
       href="https://www.tiktok.com/@hazbin.hotel486"
       target="_blank" rel="noopener noreferrer">
      TikTok
    </a>

    <a class="link instagram"
       href="https://www.instagram.com/hazbinhotelmdwbb/"
       target="_blank" rel="noopener noreferrer">
      Instagram
    </a>

    <a class="link youtube"
       href="https://www.youtube.com/@JonatanHayou-w5e5k"
       target="_blank" rel="noopener noreferrer">
      YouTube
    </a>

    <footer>
      פרויקט מעריצים עצמאי
    </footer>
  </main>
</body>
</html>
